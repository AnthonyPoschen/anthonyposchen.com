name: Lint

on:
  pull_request:
  push:

jobs:
  lint:
    name: Stylelint, Go, and Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Stylelint
        run: |
          npm ci
          npm run lint:css

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: ./...

      - name: Install Semgrep, kustomize, and kubeconform
        run: |
          python3 -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Semgrep and kubeconform
        run: |
          semgrep --error --config lint/semgrep --exclude vendor --exclude node_modules .
          rendered="$(mktemp)"
          kustomize build kustomization/overlays/prod > "$rendered"
          semgrep --error --config lint/k8s "$rendered"
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$rendered"
