<template id="page-terms">
	<div class="page-shell policy-page">
		<header class="policy-header">
			<p class="eyebrow">Terms of Service</p>
			<h1>Terms of Service</h1>
			<p class="lede">These terms apply to this website and future software products or services provided by <span data-business="publicName"></span>.</p>
			<p class="policy-meta">Last updated 5 May 2026. Business name: <span data-business="legalName"></span>.</p>
		</header>

		<section class="section policy-layout">
			<article class="policy-section">
				<h2>Business identity</h2>
				<p>This website and related software products are operated by <span data-business="legalName"></span>, an Australian individual / sole trader. ABN: <span data-business="abn"></span>.</p>
			</article>
			<article class="policy-section">
				<h2>Use of the website</h2>
				<p>You may browse this website for information about products, services, support, and policies. You must not misuse the website, attempt to disrupt it, or use it for unlawful activity.</p>
			</article>
			<article class="policy-section">
				<h2>Software products and services</h2>
				<p>Specific software products, apps, games, subscriptions, or hosting-related services may have additional product-specific terms. If product-specific terms conflict with these general terms, the product-specific terms apply for that product.</p>
			</article>
			<article class="policy-section">
				<h2>Payments and subscriptions</h2>
				<p>Paid products and subscriptions must be paid according to the pricing, billing period, and checkout terms shown at the time of purchase. Payments may be processed by third-party providers such as Stripe.</p>
			</article>
			<article class="policy-section">
				<h2>Availability and changes</h2>
				<p>Software products and hosted services may change over time. Reasonable effort is made to keep services working, but uninterrupted availability is not guaranteed unless a specific product states otherwise.</p>
			</article>
			<article class="policy-section">
				<h2>Liability</h2>
				<p>To the maximum extent allowed by law, products and services are provided without guarantees beyond those required by Australian consumer law or any product-specific written commitments.</p>
			</article>
			<article class="policy-section">
				<h2>Contact</h2>
				<p>For questions about these terms, email <a data-business-href="email" data-business="email" href="#"></a>.</p>
			</article>
		</section>
	</div>
</template>

<script>
	const pageTermsTemplate = document.getElementById('page-terms');

	customElements.define('page-terms', class extends HTMLElement {
		constructor() {
			super();
		}

		connectedCallback() {
			if (!this.hasChildNodes()) {
				this.appendChild(pageTermsTemplate.content.cloneNode(true));
			}
			window.Business?.apply(this);
		}
	});
</script>
