apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonyposchen-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anthonyposchen-com
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anthonyposchen-com
    spec:
      containers:
        - name: website
          image: ghcr.io/anthonyposchen/anthonyposchen.com:master-74389de-1779335011@sha256:e50927db03ac8c38ab74a9becdc1291bb029742f5fb2e68676ba170e44d074ac # {"$imagepolicy": "app-anthonyposchen-com:anthonyposchen-com"}
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "42069"
          ports:
            - name: http
              containerPort: 42069
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
