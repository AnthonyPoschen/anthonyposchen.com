apiVersion: apps/v1
kind: Deployment
metadata:
  name: anthonyposchen-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anthonyposchen-com
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anthonyposchen-com
    spec:
      containers:
        - name: website
          image: ghcr.io/anthonyposchen/anthonyposchen.com:master-a721c92-1779333952@sha256:82198221f1d47086b1840a84458bb35a0d093579cbd75609fdaa48f79c6667d1 # {"$imagepolicy": "app-anthonyposchen-com:anthonyposchen-com"}
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "42069"
          ports:
            - name: http
              containerPort: 42069
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
